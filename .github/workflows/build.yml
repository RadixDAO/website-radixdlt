# Build sanity check for PRs and pushes to main.
#
# This is a normal Astro site now -- the Webflow migration is done, and its verification
# suite (byte-diffing against a live-site snapshot, list-fidelity floors, head-parity,
# etc.) has been retired along with the migration archive it depended on. That history
# lives in the migration-archive repo and the backup/pre-squash-full-history branch.
#
# What's left here is cheap and has no external dependency: does it build, do internal
# links resolve, and has nothing reintroduced the one Astro footgun this codebase still
# carries -- Astro scoping or bundling a Webflow-authored inline <style>/<script> that
# must stay untouched (see tools/test-astro-artifacts.mjs).
#
# No deploy step. See wrangler.jsonc -- if CI should deploy rather than Cloudflare's own
# git integration or a manual `pnpm deploy`, that needs a token added deliberately.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
